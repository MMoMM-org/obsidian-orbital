version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR per week for all low-risk bumps.
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors stay ungrouped so each lands in its own reviewable PR.
    ignore:
      # CodeMirror must match the exact versions the Obsidian app ships;
      # obsidian's own peerDependencies pin them. Bumping causes a second
      # CodeMirror copy and type mismatches, so never auto-update these.
      - dependency-name: "@codemirror/state"
      - dependency-name: "@codemirror/view"
      # conventionalcommits preset 10.x requires conventional-changelog-writer@9,
      # but semantic-release still ships writer 8 (release-notes-generator pins
      # ^8.0.0). A 10.x bump breaks every release at generateNotes (#47) — and
      # silently, because runs with no release-worthy commit still pass. Revisit
      # when release-notes-generator moves to writer 9.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
